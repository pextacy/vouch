# `name` and the [project.scripts] key MUST equal the tool_id in executa.json —
# `anna-app dev` spawns the plugin with `uv run --project . <tool_id>`.
# `python scripts/set-tool-id.py apply --tool <minted>` rewrites all of them.
[project]
name = "tool-dev-receipts-engine"
version = "1.0.1"
description = "Receipts Engine — Executa stdio tool plugin for the Receipts Anna App"
requires-python = ">=3.12"
authors = [{ name = "Receipts" }]
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "anna-executa-test>=0.1.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
"tool-dev-receipts-engine" = "receipts_engine.plugin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["receipts_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]
# RUF001-003: the app is bilingual EN/TR — Turkish letters are content, not typos.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["../../tests"]
filterwarnings = ["error::DeprecationWarning"]
